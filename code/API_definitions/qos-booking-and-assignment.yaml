          accessTokenExpiresUtc: "2025-12-31T23:59:59Z"
          accessTokenType: bearer

    ASSIGNMENT_INPUT_2:
      summary: Assignment Input - Phone Number only
      description: Assignment Input example. To demonstrate, two devices are used, each device is identified with a phone number.
      value:
        devices:
          - phoneNumber: "+14145550101"
          - phoneNumber: "+14145550202"
        sink: "https://application-server.com/notifications"
        sinkCredential:
          credentialType: ACCESSTOKEN
          accessToken: "<access_token>"
          accessTokenExpiresUtc: "2025-12-31T23:59:59Z"
          accessTokenType: bearer

    ASSIGNMENT_SUCCESSFUL:
      summary: Assignment Successful
      description: Assignment is successful and all requested devices were successfully assigned to the given booking.
      value:
        bookingDetails:
          bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
          bookingDeviceCount: 15
          remainingDevices: 11
          qosProfile: "QOS_MEDIA_BROADCAST"
          startTime: "2025-10-27T15:00:00.000Z"
          duration: 3600
          serviceArea:
            areaType: "CIRCLE"
            center:
              latitude: 37.735851
              longitude: -127.10066
            radius: 100
        devices:
          - phoneNumber: "+14145550101"
          - networkAccessIdentifier: "+123456789@domain.com"
          - ipv4Address:
              publicAddress: "203.0.113.0"
              publicPort: 59765
          - ipv6Address: "2001:db8:85a3:8d3:1319:8a2e:370:7344"
        assignmentStatus: "ASSIGNED"
        statusInfo: "ASSIGNMENT_COMPLETED"

    ASSIGNMENT_PARTIAL_SUCCESS:
      summary: Assignment Partially Successful
      description: Assignment is successful and some but not all of the requested devices are assigned.
      value:
        bookingDetails:
          bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
          bookingDeviceCount: 15
          remainingDevices: 13
          qosProfile: "QOS_MEDIA_BROADCAST"
          startTime: "2025-10-27T15:00:00.000Z"
          duration: 3600
          serviceArea:
            areaType: "CIRCLE"
            center:
              latitude: 37.735851
              longitude: -127.10066
            radius: 100
        devices:
          - phoneNumber: "+14145550101"
          - ipv4Address:
              publicAddress: "203.0.113.0"
              publicPort: 59765
        assignmentStatus: "PARTIAL_SUCCESS"
        statusInfo: "ASSIGNMENT_COMPLETED"

    ASSIGNMENT_PENDING:
      summary: Assignment Pending
      description: Assignment request is still being processed. None of the requested devices are assigned.
      value:
        bookingDetails:
          bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
          bookingDeviceCount: 15
          remainingDevices: 15
          qosProfile: "QOS_MEDIA_BROADCAST"
          startTime: "2025-10-27T15:00:00.000Z"
          duration: 3600
          serviceArea:
            areaType: "CIRCLE"
            center:
              latitude: 37.735851
              longitude: -127.10066
            radius: 100
        assignmentStatus: "REQUESTED"
        statusInfo: "VALIDATION_PENDING"

    ASSIGNMENT_FAILURE_1:
      summary: Assignment Failed
      description: Assignment request failed. Booking is still valid.
      value:
        bookingDetails:
          bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
          bookingDeviceCount: 15
          remainingDevices: 15
          qosProfile: "QOS_MEDIA_BROADCAST"
          startTime: "2025-10-27T15:00:00.000Z"
          duration: 3600
          serviceArea:
            areaType: "CIRCLE"
            center:
              latitude: 37.735851
              longitude: -127.10066
            radius: 100
        assignmentStatus: "FAILURE"
        statusInfo: "QUOTA_EXCEEDED"

    ASSIGNMENT_FAILURE_2:
      summary: Assignment Failed for unknown booking information
      description: Assignment request failed. Provided `bookingId` is correctly formed but not available. In such a situation, value contains only `assignmentStatus` and `statusInfo`.
      value:
        assignmentStatus: "FAILURE"
        statusInfo: "BOOKING_INVALID"

    ASSIGNMENT_RELEASE_INPUT:
      summary: Assignment Release Input
      description: This is an example of a device that needs to be released from the given booking.
      value:
        devices:
          - phoneNumber: "+14145550101"

    ASSIGNMENT_RELEASED:
      summary: Assignment released successfully
      description: The requested device was successfully released from the booking. `assignmentStatus` is `RELEASED` and `remainingDevices` is incremented by the number of released devices.
      value:
        bookingDetails:
          bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
          bookingDeviceCount: 15
          remainingDevices: 14
          qosProfile: "QOS_MEDIA_BROADCAST"
          startTime: "2025-10-27T15:00:00.000Z"
          duration: 3600
          serviceArea:
            areaType: "CIRCLE"
            center:
              latitude: 37.735851
              longitude: -127.10066
            radius: 100
        devices:
          - phoneNumber: "+14145550101"
        assignmentStatus: "RELEASED"
        statusInfo: "DEVICE_RELEASED"

    ASSIGNMENT_RELEASE_PENDING:
      summary: Release is pending for requested devices
      description: Release of requested devices is currently in progress. Some might have already been released, and some are still being processed.
      value:
        bookingDetails:
          bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
