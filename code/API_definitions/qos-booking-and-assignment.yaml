openapi: 3.0.3
info:
  title: QoS Booking and Assignment
  description: |
    This API enables API consumers to request, in advance, certain network performance to be provided by Telco networks, without having in-depth knowledge of the underlying network complexities (e.g. the 4G/5G system in case of a mobile network) for a number of devices, at a given location, for a period of time.

    The API enables API consumers to book a specific QoS profile for one or more devices with conditions such as the start time, duration and location. Once the booking is confirmed the enduser can assign devices to the booking.
    The network operator will provision and activate those devices with the required and agreed network quality at the given time and conditions

    # Relevant terms and definitions

    * **QoS profiles**:
    Latency, throughput or priority requirements of the application mapped to relevant QoS profile values. The set of QoS Profiles that a network operator is offering may be retrieved via the `qos-profiles` API (cf. https://github.com/camaraproject/QualityOnDemand/) or will be agreed during the onboarding with the API service provider.

    * **Identifier for the device**:
    At least one identifier for the device (user equipment) out of four options: IPv4 address, IPv6 address, Phone number, or Network Access Identifier assigned by the network operator for the device, at the request time. After the booking request is accepted, the device may get different IP addresses, but the booking will still apply to the device that was identified during the request process. Note: Network Access Identifier is defined for future use and is not currently supported.

    * **Notification URL and token**:
    API consumers may provide a callback URL (`sink`) on which notifications about all status change events (e.g. duration expiration) can be received from the API provider. This is an optional parameter. The notification will be sent as a CloudEvent compliant message. If `sink` is included, it is RECOMMENDED for the client to provide as well the `sinkCredential` property to protect the notification endpoint. In the current version,`sinkCredential.credentialType` MUST be set to `ACCESSTOKEN` or `PRIVATE_KEY_JWT` if provided.

    # Resources and Operations overview
    The API defines seven major operations in two groups:

    Booking:

    - An operation to setup a new QoS Booking for one or more devices.
    - An operation to get the information about an existing QoS Booking, identified by its `BookingId`.
    - An operation to terminate an existing QoS Booking, identified by its `BookingId`.

    Device Assignment:

     - An operation to assign one or more devices to the existing booking identified by its `BookingId`.
     - An operation to release one or more devices from the booking identified by its `BookingId`.
     - An operation to get all the devices assigned to a given booking identified by its `BookingId`.
     - An operation to get all the associated QoS Booking for a given device.

    # Booking and assignment lifecycle

    This API manages two distinct but related lifecycles: the **booking lifecycle** and the
    **device assignment lifecycle**. Both are explicit state machines with named states observable
    in API responses via `bookingStatus` and `assignmentStatus`, and delivered as CloudEvents
    when a `sink` was registered at booking creation.

    ## Booking lifecycle

    ```
    POST /qos-bookings
            │
            ▼
      ┌─────────────┐
      │  REQUESTED  │  Accepted; operator confirmation pending.
      └──────┬──────┘
             │  booking-status-changed (SCHEDULED or TERMINATED)
             ▼
      ┌─────────────┐
      │  SCHEDULED  │  Confirmed; QoS resources reserved for future start time.
      └──────┬──────┘
             │  at start time → ACTIVATED; booking-status-changed (TERMINATED if cancelled)
             ▼
      ┌─────────────┐
      │   ACTIVATED │  Booking window open; QoS resources live.
      └──────┬──────┘
             │  booking-status-changed (TERMINATED)
             ▼
      ┌─────────────┐
      │ TERMINATED  │  Terminal. bookingId no longer addressable.
      └─────────────┘
    ```

    | State | Meaning | Notification sent |
    |---|---|---|
    | `REQUESTED` | Booking accepted and `bookingId` assigned; operator is validating network availability. `statusInfo: VALIDATION_PENDING`. | None — poll or await `booking-status-changed`. |
    | `SCHEDULED` | Confirmed; QoS resources reserved. Devices may be assigned now. `statusInfo: BOOKING_SCHEDULED`. | `booking-status-changed` (`bookingStatus: SCHEDULED`). |
    | `ACTIVATED` | Booking window open; QoS resources live. `statusInfo: BOOKING_ACTIVATED`. | `booking-status-changed` (`bookingStatus: ACTIVATED`). |
    | `TERMINATED` | Terminal. `statusInfo` carries the reason: `BOOKING_CANCELLED`, `BOOKING_EXPIRED`, `DURATION_EXPIRED`, `SERVICE_NOT_AVAILABLE`, `QOS_PROFILE_NOT_SUPPORTED`, `NETWORK_TERMINATED`, or `BOOKING_UNKNOWN_ERROR`. | `booking-status-changed` (`bookingStatus: TERMINATED`). |

    A booking may transition from any non-terminal state directly to `TERMINATED`.
    For synchronous operators, `SCHEDULED` or `ACTIVATED` (when the start time is immediate) may be
    returned directly in the `createBooking` `201` response with no `REQUESTED` intermediate state.

    ## Device assignment lifecycle

    A booking MUST be in `SCHEDULED` or `ACTIVATED` state before devices can be assigned.
    Both `assignDevices` and `releaseDevices` share the same `AssignmentStatus` outcome model.

    Operators may resolve assignment and release synchronously (returning the final state in the
    operation response directly), asynchronously (returning `REQUESTED` immediately and delivering
    the final state via notification), or in a hybrid model where the approach depends on available
    compute resources or network conditions at the time of the request.

    ```
    POST …/devices/assign              POST …/devices/release
            │                                  │
            ▼                                  ▼
      ┌───────────┐                      ┌───────────┐
      │ REQUESTED │  (deferred only)     │ REQUESTED │  (deferred only)
      └─────┬─────┘                      └─────┬─────┘
            │  assignment-status-changed       │  assignment-status-changed
            ▼                                  ▼
      ASSIGNED | PARTIAL_SUCCESS | FAILURE    RELEASED | PARTIAL_SUCCESS | FAILURE
    ```

    | State | Operation | Meaning |
    |---|---|---|
    | `REQUESTED` | assign, release | Request accepted; final state will arrive via `assignment-status-changed` notification. |
    | `ASSIGNED` | assign only | All requested devices are now assigned to the booking. |
    | `RELEASED` | release only | All requested devices have been released from the booking. |
    | `PARTIAL_SUCCESS` | assign, release | Some but not all devices were processed. The response `deviceDetails` enumerates the successfully processed devices; absent devices were not. `statusInfo` provides the reason (e.g.  `DEVICE_NOT_FOUND`). |
    | `FAILURE` | assign, release | Operation failed for all requested devices. `statusInfo` provides the reason. |

    ## Notifications

    All status-change events — booking and assignment — are delivered to the single `sink`
    registered during `createBooking`. No separate sink is registered for `assignDevices`
    or `releaseDevices`.

    | CloudEvent type | Fired when | Schema |
    |---|---|---|
    | `…v0.booking-status-changed` | Booking transitions to `SCHEDULED`, `ACTIVATED`, or `TERMINATED` | `EventBookingStatusChanged` |
    | `…v0.assignment-status-changed` | Assign or release resolves from `REQUESTED` to a final state | `EventAssignmentStatusChanged` |

    The `REQUESTED` intermediate state is not notified; it is observable only via polling
    (`GET /qos-bookings/{bookingId}`).

    <!-- CAMARA:MANDATORY:authorization-and-authentication:BEGIN -->

    # Authorization and authentication

    The "Camara Security and Interoperability Profile" provides details of how an API consumer requests an access token. Please refer to Identity and Consent Management (https://github.com/camaraproject/IdentityAndConsentManagement/) for the released version of the profile.

    The specific authorization flows to be used will be agreed upon during the onboarding process, happening between the API consumer and the API provider, taking into account the declared purpose for accessing the API, whilst also being subject to the prevailing legal framework dictated by local legislation.

    In cases where personal data is processed by the API and users can exercise their rights through mechanisms such as opt-in and/or opt-out, the use of three-legged access tokens is mandatory. This ensures that the API remains in compliance with privacy regulations, upholding the principles of transparency and user-centric privacy-by-design.
    <!-- CAMARA:MANDATORY:authorization-and-authentication:END -->

    <!-- CAMARA:MANDATORY:identifying-device-from-access-token:BEGIN -->

    # Identifying the device from the access token

    This API requires the API consumer to identify a device as the subject of the API as follows:
    - When the API is invoked using a two-legged access token, the subject will be identified from the optional `device` or `devices` object, which therefore MUST be provided.

    - When a three-legged access token is used however, this optional identifier MUST NOT be provided, as the subject will be uniquely identified from the access token. In this case, only one device can be provided at a time.

    This approach simplifies API usage for API consumers using a three-legged access token to invoke the API by relying on the information that is associated with the access token and was identified during the authentication process.

    ## Error handling:

    - If the subject cannot be identified from the access token and the optional `device` object is not included in the request, then the server will return an error with the `422 MISSING_IDENTIFIER` error code.

    - If the subject can be identified from the access token and the optional `device` object is also included in the request, then the server will return an error with the `422 UNNECESSARY_IDENTIFIER` error code. This will be the case even if the same device is identified by these two methods, as the server is unable to make this comparison.
    <!-- CAMARA:MANDATORY:identifying-device-from-access-token:END -->

    # Three-legged access token restrictions

    This API supports both two-legged and three-legged access tokens. Two-legged tokens are
    used by operators or enterprise applications managing bookings and device assignments on
    behalf of multiple devices. Three-legged tokens are used in end-user self-service scenarios
    where the subject device is uniquely identified from the token; in these operations the
    `device` or `devices` field MUST NOT be provided in the request body, as the subject is
    resolved from the token. Because a three-legged token identifies exactly one device,
    operations that assign or release multiple devices require a two-legged token. An operator
    may adopt a pattern where a multi-device booking is created using a two-legged token and
    individual end-users subsequently self-assign or self-release their own device using a
    three-legged token.

    # Multi-SIM scenario handling

    In multi-SIM scenarios where more than one mobile device is associated with a phone number (e.g. a smartphone with an associated smartwatch), it might not be possible to uniquely identify the device to which the enhanced QoS profile should apply from that phone number. If the phone number is used as the device identifier when creating a QoS booking in a multi-SIM scenario, the API may respond with an error, apply the enhanced QoS profile to all devices in the multi-SIM group, or apply the enhanced QoS profile to a single device in the multi-SIM group which may not be the intended device.

    Possible solutions in such a scenario include:
    - Using the authorisation code flow to obtain an access token, which will automatically identify the intended device
    - Identifying the intended device from a unique identifier for that device, such as its source IP address and port
    - Check with the SIM provider whether a unique "secondary" phone number is already associated with each device, and use the secondary phone number to identify the intended device if available

    # API-specific error behaviour

    The following summarises error codes specific to this API, their trigger conditions,
    and which operations each applies to. Standard CAMARA error codes (`401`, `403`, `429`,
    `500`, `503`) are not repeated here; refer to `CAMARA_common.yaml` for their definitions.

    ## API-specific 400 codes

    | Code | When raised | Operations |
    |---|---|---|
    | `INVALID_ARGUMENT` | Malformed request body, unrecognised field, or invalid field value. | All write operations |
    | `OUT_OF_RANGE` | A numeric value (e.g. device count) exceeds its declared bounds. | `createBooking`, `assignDevices` |
    | `QOS_BOOKING_AND_ASSIGNMENT.DURATION_OUT_OF_RANGE` | The requested booking duration exceeds the maximum allowed by the selected QoS profile. | `createBooking` only |
    | `INVALID_SINK` | The `sink` URL is not a valid callback endpoint or uses an unsupported protocol. | `createBooking` only |

    ## API-specific 409 codes

    | Code | When raised | Operations |
    |---|---|---|
    | `INCOMPATIBLE_STATE` | The operation is not valid for the booking's current `bookingStatus`. Examples: assigning devices to a `TERMINATED` booking; `deleteBooking` when devices remain assigned (provider-dependent — see `deleteBooking` description). | `createBooking`, `deleteBooking`, `assignDevices`, `releaseDevices` |
    | `ABORTED` | A concurrent operation of the same type is already in progress for the same booking. Retry after the in-progress operation resolves. | `assignDevices`, `releaseDevices` |
    | `ALREADY_EXISTS` | A booking with identical parameters already exists for this consumer. | `createBooking` |
    | `CONFLICT` | A duplicate resource entry was detected. | `createBooking` |

    > **Note:** `ALREADY_EXISTS` and `CONFLICT` do not apply to read operations or
    > `deleteBooking` / `releaseDevices`. These codes are included in the shared `Generic409`
    > definition and will be scoped to individual operations in a future cleanup.

    <!-- CAMARA:MANDATORY:additional-error-responses:BEGIN -->

    # Additional CAMARA error responses

    The list of error codes in this API specification is not exhaustive. Therefore the API specification MAY not document some non-mandatory error statuses as indicated in `CAMARA API Design Guide`.

    Please refer to the `CAMARA_common.yaml` of the Commonalities Release associated to this API version for a complete list of error responses. The applicable Commonalities Release can be identified from the `x-camara-commonalities` field, the changelog and the metadata of the released API version.

    As a specific rule, error `501 - NOT_IMPLEMENTED` can be only a possible error response if it is explicitly documented in the API.
    <!-- CAMARA:MANDATORY:additional-error-responses:END -->

    <!-- CAMARA:MANDATORY:request-body-strictness:BEGIN -->

    # Request body strictness

    This API rejects requests with JSON request bodies that contain properties not declared in this specification, at any nesting level. Unknown properties result in a `400 INVALID_ARGUMENT` response.
    <!-- CAMARA:MANDATORY:request-body-strictness:END -->

    # Further info and support
    (FAQs will be added in a later version of the documentation)

  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: wip
  x-camara-commonalities: 0.8.0

externalDocs:
  description: Product documentation at CAMARA
  url: https://github.com/camaraproject/QoSBooking

servers:
  - url: "{apiRoot}/qos-booking-and-assignment/vwip"
    variables:
      apiRoot:
        default: http://localhost:9091
        description: API root, defined by the service provider, e.g. `api.example.com` or `api.example.com/somepath`
tags:
  - name: QoS Booking
    description: Book and manage QoS for multiple devices in advance
  - name: Device Assignment
    description: Manage the assignment of devices for a given QoS Booking

paths:
  /qos-bookings:
    post:
      tags:
        - QoS Booking
      summary: This operation reserves required QoS in advance up to a certain number of devices in certain serviceArea and time slot. The devices have to be attached with a subsequent operation.
      description: |
        This operation reserves a Quality of Service (QoS) booking for a specified number of devices, service area, and scheduled time/duration.
        Devices can be assigned to the booking at any time after the reservation is confirmed and before the scheduled end-time.
        - `Pre-assigned devices :` These devices will be automatically provisioned and activated with the requested QoS profile exactly when the scheduled start time arrives.
        - `Late-assigned devices:` Devices assigned after the schedule starts (but before it ends) will be provisioned and activated with the requested QoS profile immediately upon assignment.
        This operation will return with the following responses:
        - `HTTP 201 (bookingStatus: SCHEDULED):` The operator confirmed the booking; the start time is in the future.
        - `HTTP 201 (bookingStatus: ACTIVATED):` The operator confirmed the booking; the start time is now or in the past and the window is live.
        - `HTTP 201 (bookingStatus: TERMINATED):` The operator determined synchronously that the booking cannot be fulfilled. `statusInfo` provides the reason.
        - `HTTP 201 (bookingStatus: REQUESTED):` The booking resource is created and a `bookingId` is returned, but operator confirmation is still pending. A `booking-status-changed` notification will be sent to the registered `sink` with the final outcome (`SCHEDULED`, `ACTIVATED`, or `TERMINATED`).
        - `HTTP 4xx (Failure Condition):` The request itself was invalid. The response will include specific error codes and descriptions.
        - `statusInfo` contains additional information under certain conditions.
      operationId: createBooking
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        description: Input Parameters to create a new booking
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
            examples:
              BOOKING_INPUT_1:
                $ref: "#/components/examples/BOOKING_INPUT_1"
              BOOKING_INPUT_2:
                $ref: "#/components/examples/BOOKING_INPUT_2"
        required: true
      callbacks:
        notifications:
          "{$request.body#/sink}":
            post:
              summary: Booking notifications callback
              description: |
                Important: this endpoint is to be implemented by the API consumer.
                The API provider will call this endpoint whenever any QoS Booking change related event occurs.
              operationId: postBookingNotification
              parameters:
                - $ref: "#/components/parameters/x-correlator"
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/QosBookingNotificationEvent"
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "#/components/headers/x-correlator"
                "400":
                  $ref: "#/components/responses/Generic400"
                "401":
                  $ref: "#/components/responses/Generic401"
                "403":
                  $ref: "#/components/responses/Generic403"
                "410":
                  $ref: "#/components/responses/Generic410"
                "429":
                  $ref: "#/components/responses/Generic429"
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        "201":
          description: |
            Booking resource created. `bookingStatus` values and `bookingId` presence rules:

            | `bookingStatus` | `bookingId` present | Meaning |
            |---|:---:|---|
            | `SCHEDULED` | Yes | Operator confirmed; start time is in the future. |
            | `ACTIVATED` | Yes | Operator confirmed; start time is now or in the past and the window is live. |
            | `REQUESTED` | Yes | Resource created and `bookingId` assigned; operator confirmation is still in progress. A `booking-status-changed` notification delivers the final outcome. |
            | `TERMINATED` | No | Operator rejected the booking synchronously; no resource was created. `statusInfo` provides the reason (e.g. `SERVICE_NOT_AVAILABLE`). |
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingOutput"
              examples:
                BOOKING_SUCCESSFUL:
                  $ref: "#/components/examples/BOOKING_SUCCESSFUL"
                BOOKING_FAILURE:
                  $ref: "#/components/examples/BOOKING_FAILURE"
                BOOKING_PENDING:
                  $ref: "#/components/examples/BOOKING_PENDING"
        "400":
          $ref: "#/components/responses/CreateBookingOrAssign400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "409":
          $ref: "#/components/responses/Generic409"
        "422":
          $ref: "#/components/responses/Generic422"
        "429":
          $ref: "#/components/responses/Generic429"
      security:
        - openId:
            - "qos-booking-and-assignment:qos-bookings:create"

  /qos-bookings/{bookingId}:
    get:
      tags:
        - QoS Booking
      summary: Get the Booking information for a given QoS Booking identified by `bookingId`.
      description: |
        This operation is synchronous and retrieves the details of an existing Quality of Service (QoS) booking using its unique identifier (`bookingId`). This `bookingId` is the identifier returned by the initial booking operation upon successful creation.

        Response Scenarios:
          - `HTTP 200:` The booking details are successfully retrieved and returned in the response body. The `bookingStatus` field reflects the current booking lifecycle state (`REQUESTED`, `SCHEDULED`, `ACTIVATED`, or `TERMINATED`) and `remainingDevices` shows how many devices can still be assigned.
          - `HTTP 4xx:` The request failed. An appropriate HTTP 4xx error code is returned with a specific error code and description.
      operationId: getBookingById
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/x-correlator"
      responses:
        "200":
          description: Returns information about certain booking
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingOutput"
              examples:
                BOOKING_RETRIEVED:
                  $ref: "#/components/examples/BOOKING_RETRIEVED"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "429":
          $ref: "#/components/responses/Generic429"
      security:
        - openId:
            - "qos-booking-and-assignment:qos-bookings:read"

    delete:
      tags:
        - QoS Booking
      summary: This operation cancels an existing QoS Booking and release the associated resources.
      description: |
        This operation cancels and deletes a specific QoS booking using its unique identifier and releases the resources related to that booking. It supports both synchronous and asynchronous processing.
        Constraints & Notes:
          - The Quality of Service (QoS) booking must have been created by the same API client identified in the access token.
          - Operators SHOULD properly document their `Booking Cancellation` behavior with clear policies and the respective terms and conditions.
          - **Behavior when devices are still assigned is implementation-defined and MUST be documented by the API provider:**
            - Some providers will reject the DELETE and return `409 INCOMPATIBLE_STATE`, requiring the consumer to release all devices first via `POST /qos-bookings/{bookingId}/devices/release`.
            - Other providers will automatically release all assigned devices as part of the DELETE and return `204 No Content`.
            - API consumers SHOULD release all assigned devices before invoking DELETE for portable, provider-agnostic behavior.
          - **Cancellation CloudEvent delivery:** When deletion is processed asynchronously (202), the `CANCELLED` `booking-status-changed` CloudEvent is delivered to the `sink` registered at booking creation. Consumers that require cancellation notifications MUST provide a `sink` when creating the booking.
        Response Scenarios:
          - `HTTP 204:` The booking was cancelled immediately (synchronous success). No response body is returned.
          - `HTTP 202 (bookingStatus: REQUESTED):` The request has been accepted for processing, but the deletion is not yet complete. A `booking-status-changed` notification will be sent with `bookingStatus` = `TERMINATED` and `statusInfo` = `BOOKING_CANCELLED`.
          - `HTTP 4xx (Failure Condition):` The request failed, and an appropriate HTTP 4xx error code is returned with a specific status and description.
      operationId: deleteBooking
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/x-correlator"
      responses:
        "204":
          description: Booking cancelled successfully. No response body is returned.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
        "202":
          description: |
            Deletion request accepted for asynchronous processing. `bookingStatus` = `REQUESTED`, `statusInfo` = `DELETE_REQUESTED`.
            A `booking-status-changed` CloudEvent with `bookingStatus` = `TERMINATED` and `statusInfo` = `BOOKING_CANCELLED` will be sent to the `sink` registered at booking creation.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingOutput"
              examples:
                CANCELLATION_PENDING:
                  $ref: "#/components/examples/CANCELLATION_PENDING"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "409":
          $ref: "#/components/responses/Generic409"
        "429":
          $ref: "#/components/responses/Generic429"
      security:
        - openId:
            - "qos-booking-and-assignment:qos-bookings:delete"

  /qos-bookings/{bookingId}/devices/assign:
    post:
      tags:
        - Device Assignment
      summary: Assign one or more devices to an existing QoS Booking identified by `bookingId`
      description: |
        This endpoint allows the end user to assign one or more devices to the existing QoS Booking.
        - If the assignment is successful for all the devices, the call will return 201 success code with assignmentStatus `ASSIGNED` and the network is available for the said devices to connect and use them at the requested time
        - If the assignment request failed for some reason, this call we be retured with 4xx error code with appropirate status codes
        - This is an asynchronous call, and assignmentStatus = `REQUESTED` if the network is still processing your request. A callback will deliver the final assignmentStatus.
        - If the network could not assign all the requested devices, then assignmentStatus = `PARTIAL_SUCCESS` and the `statusInfo` will have additional information.
        - If a 2-legged access token is used, then the device details SHOULD BE provided as part of the input, and the output will return the array of actually assigned devices.
        - If a 3-legged access token is used, then the device information are identified from the access token, so only one device is implicitly assigned, and the return value may not contain the assigned device information
      operationId: assignDevices
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        description: Parameters to create a new booking
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAssignmentInput"
            examples:
              ASSIGNMENT_INPUT_1:
                $ref: "#/components/examples/ASSIGNMENT_INPUT_1"
              ASSIGNMENT_INPUT_2:
                $ref: "#/components/examples/ASSIGNMENT_INPUT_2"
        required: true
      callbacks:
        notifications:
          "{$request.body#/sink}":
            post:
              summary: Assignment notifications callback
              description: |
                Important: this endpoint is to be implemented by the API consumer.
                The API provider will call this endpoint whenever any QoS Assignment change related event occurs.
              operationId: postAssignmentNotification
              parameters:
                - $ref: "#/components/parameters/x-correlator"
              requestBody:
                required: true
                content:
                  application/cloudevents+json:
                    schema:
                      $ref: "#/components/schemas/QosBookingNotificationEvent"
              responses:
                "204":
                  description: Successful notification
                  headers:
                    x-correlator:
                      $ref: "#/components/headers/x-correlator"
                "400":
                  $ref: "#/components/responses/Generic400"
                "401":
                  $ref: "#/components/responses/Generic401"
                "403":
                  $ref: "#/components/responses/Generic403"
                "410":
                  $ref: "#/components/responses/Generic410"
                "429":
                  $ref: "#/components/responses/Generic429"
              security:
                - {}
                - notificationsBearerAuth: []
      responses:
        "201":
          description: At least one device is assigned to the booking. The developer can call this endpoint multiple times with appropriate information
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAssignmentOutput"
              examples:
                ASSIGNMENT_SUCCESSFUL:
                  $ref: "#/components/examples/ASSIGNMENT_SUCCESSFUL"
                ASSIGNMENT_PARTIAL_SUCCESS:
                  $ref: "#/components/examples/ASSIGNMENT_PARTIAL_SUCCESS"
                ASSIGNMENT_FAILURE_1:
                  $ref: "#/components/examples/ASSIGNMENT_FAILURE_1"
                ASSIGNMENT_FAILURE_2:
                  $ref: "#/components/examples/ASSIGNMENT_FAILURE_2"

        "202":
          description: |
            Assignment request is accepted but pending decision.
            Once the decision is made a callback notification will be sent with appropirate success or failure Confirmation
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAssignmentOutput"
              examples:
                ASSIGNMENT_PENDING:
                  $ref: "#/components/examples/ASSIGNMENT_PENDING"

        "400":
          $ref: "#/components/responses/CreateBookingOrAssign400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "409":
          $ref: "#/components/responses/Generic409"
        "422":
          $ref: "#/components/responses/Generic422"
        "429":
          $ref: "#/components/responses/Generic429"
      security:
        - openId:
            - "qos-booking-and-assignment:qos-bookings:devices:create"

  /qos-bookings/{bookingId}/devices:
    get:
      tags:
        - Device Assignment
      summary: Get the list of devices assigned to an existing QoS Booking
      description: |
        This endpoint allows the end user to retrieve the list of devices assigned to the existing QoS Booking.
        - assignmentStatus = `ASSIGNED` if the operation is successful
        - assignmentStatus = `FAILURE`  if the operation is unsuccessful then the `statusInfo` will have more information.
        - GET may not return the identifying details of all the devices assigned to the booking. There are certain situations, identifying details of certain devices can't be disclosed because of privacy laws, jurisdiction restrictions, and some legal requirements.
          In such a situation the operator SHOULD properly communicate this to the API consumer that device identifiers of certain devices are not disclosed. `statusInfo` = `DEVICE_DISCLOSURE_POLICY_APPLIED`
        - The API consumer can determine; how many devices are actually in the booking from 'bookingDetails'; but may not know the identifying details of all those devices.
        - A classic example is: Some of the devices are assigned using a 3-legged access token; Or a booking is made in one jurisdiction and the actual usage is happening in another jurisdiction which has several privacy restrictions.

      operationId: getDevicesByBookingId
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/x-correlator"
      responses:
        "200":
          description: List of all devices assigned to the booking is returned.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAssignmentOutput"
              examples:
                ASSIGNMENT_RETRIEVED_1:
                  $ref: "#/components/examples/ASSIGNMENT_RETRIEVED_1"
                ASSIGNMENT_RETRIEVED_2:
                  $ref: "#/components/examples/ASSIGNMENT_RETRIEVED_2"

        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "429":
          $ref: "#/components/responses/Generic429"
      security:
        - openId:
            - "qos-booking-and-assignment:qos-bookings:devices:read"

  /qos-bookings/{bookingId}/devices/release:
    post:
      tags:
        - Device Assignment
      summary: Release one or more devices from the given QoS Booking
      description: |
        This endpoint will release one or more assigned devices. The timing of the release depends on the current status:

        - `Before the scheduled time:` The release will be mostly immediate.
        - `After the scheduled time (devices active):` The release may take time as the system needs to free up associated resources.

         A callback notification will be sent once the devices are successfully released, provided one is registered with the device assignment. This endpoint functions in both synchronous and asynchronous modes.
        - If the device is assigned using 3-legged access token:
          - If the device is active, then release can happen in the same way.
          - If the device has failed for some reason, and the device information is not known, then the device can't be released from booking.
        - This call uses the POST method to comply with the CAMARA Commonalities guidelines for sending sensitive or complex data in API calls. Since the device field may contain personally identifiable information, it should not be sent via DELETE.
      operationId: releaseDevices
      parameters:
        - $ref: "#/components/parameters/BookingId"
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        description: Parameters to release devices
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAssignmentInput"
            examples:
              ASSIGNMENT_RELEASE_INPUT:
                $ref: "#/components/examples/ASSIGNMENT_RELEASE_INPUT"
        required: true
      responses:
        "200":
          description: |
            At least one of the requested devices has been successfully released from the booking.

            Example:

              If an end-user requests to release two devices but the network can release only one:
              - The `assignmentStatus` will be `PARTIAL_SUCCESS`.
              - The `statusInfo` field will contain additional details.

              The returned message body will also contain the list of the actual devices that were released.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAssignmentOutput"
              examples:
                ASSIGNMENT_RELEASED:
                  $ref: "#/components/examples/ASSIGNMENT_RELEASED"
        "202":
          description: |
            The release request is accepted but is pending for internal reasons, or the release process has started and is currently in progress.
            Once all devices are released, a callback notification will be sent with the appropriate success or failure confirmation
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAssignmentOutput"
              examples:
                ASSIGNMENT_RELEASE_PENDING:
                  $ref: "#/components/examples/ASSIGNMENT_RELEASE_PENDING"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "404":
          $ref: "#/components/responses/Generic404"
        "409":
          $ref: "#/components/responses/Generic409"
        "422":
          $ref: "#/components/responses/Generic422"
        "429":
          $ref: "#/components/responses/Generic429"
      security:
        - openId:
            - "qos-booking-and-assignment:qos-bookings:devices:delete"

  /qos-bookings/retrieve:
    post:
      tags:
        - Device Assignment
      summary: Retrieves all the bookings that corresponds to a device
      description: |
        Querying for QoS Booking resource information details for a device.
        **NOTES:**
        - The access token may be either 2-legged or 3-legged.
          - If a 3-legged access token is used, the subject associated with the QoS Booking must also be associated with the access token.  In this case the optional `device` parameter MUST NOT be provided in the request.
          - If a 2-legged access token is used, the device parameter must be provided and identify a device.
        - The QoS Booking must have been created by the same API client given in the access token.
        - If no QoS booking is found for the requested device, an empty array is returned.
        - This call uses the POST method to comply with the CAMARA Commonalities guidelines for sending sensitive or complex data in API calls. Since the device field may contain personally identifiable information, it should not be sent via GET.
      operationId: retrieveBookingByDevice
      parameters:
        - $ref: "#/components/parameters/x-correlator"
      requestBody:
        description: Parameters to retrieve a booking by device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrieveBookingByDevice"
            examples:
              RETRIEVE_BOOKINGS_INPUT:
                $ref: "#/components/examples/RETRIEVE_BOOKINGS_INPUT"
        required: true
      responses:
        "200":
          description: Returns the QoS booking information for a given device. A device may have multiple bookings (for several times and locations), thus the response is an array. An empty array is returned if no sessions are found.
          headers:
            x-correlator:
              $ref: "#/components/headers/x-correlator"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrieveBookingsOutput"
              examples:
                RETRIEVE_BOOKINGS_ONE_ITEM:
                  $ref: "#/components/examples/RETRIEVE_BOOKINGS_ONE_ITEM"
                RETRIEVE_BOOKINGS_NO_ITEMS:
                  $ref: "#/components/examples/RETRIEVE_BOOKINGS_NO_ITEMS"
        "400":
          $ref: "#/components/responses/Generic400"
        "401":
          $ref: "#/components/responses/Generic401"
        "403":
          $ref: "#/components/responses/Generic403"
        "422":
          $ref: "#/components/responses/Generic422"
        "429":
          $ref: "#/components/responses/Generic429"
      security:
        - openId:
            - "qos-booking-and-assignment:qos-bookings:retrieve-by-device"

components:
  securitySchemes:
    openId:
      $ref: "../common/CAMARA_common.yaml#/components/securitySchemes/openId"
    notificationsBearerAuth:
      $ref: "../common/CAMARA_event_common.yaml#/components/securitySchemes/notificationsBearerAuth"

  parameters:
    BookingId:
      name: bookingId
      in: path
      description: Booking ID that was obtained from the createBooking operation
      required: true
      schema:
        $ref: "#/components/schemas/BookingId"

    x-correlator:
      $ref: "../common/CAMARA_common.yaml#/components/parameters/x-correlator"

  headers:
    x-correlator:
      $ref: "../common/CAMARA_common.yaml#/components/headers/x-correlator"

  schemas:
    BookingId:
      description: Booking Identifier in UUID format
      type: string
      format: uuid
      maxLength: 36

    BookingInput:
      description: |
        Basic input that are required to book QoS in advance. `bookingDeviceCount` represents the maximum number of devices the enduser wants the operator to reserve in advance.
      allOf:
        - type: object
          properties:
            bookingDeviceCount:
              $ref: "#/components/schemas/DeviceCount"
            qosProfile:
              $ref: "#/components/schemas/QosProfileName"
            startTime:
              $ref: "#/components/schemas/Time"
            duration:
              $ref: "#/components/schemas/Duration"
            serviceArea:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/Area"
            sink:
              type: string
              format: uri
              maxLength: 2048
              pattern: "^https:\/\/.+$"
              description: The address to which events shall be delivered, using the HTTP protocol.
              example: "https://endpoint.example.com/sink"
            sinkCredential:
              $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"
          required:
            - qosProfile
            - startTime
            - duration
            - serviceArea

    BookingDetails:
      description: |
        The details of booking.  This schema can be used in any place booking details need to be returned.

      allOf:
        - type: object
          properties:
            bookingId:
              $ref: "#/components/schemas/BookingId"
            bookingDeviceCount:
              $ref: "#/components/schemas/DeviceCount"
            remainingDevices:
              $ref: "#/components/schemas/RemainingDeviceCount"
            qosProfile:
              $ref: "#/components/schemas/QosProfileName"
            startTime:
              $ref: "#/components/schemas/Time"
            duration:
              $ref: "#/components/schemas/Duration"
            serviceArea:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/Area"
            bookingStatus:
              $ref: "#/components/schemas/BookingStatus"
          required:
            - bookingId
            - remainingDevices
            - qosProfile
            - startTime
            - duration
            - serviceArea

    BookingOutput:
      description: |
        - If the booking endpoint returns synchronously, `BookingOutput` will be part of the return message body. For async success a follow-up `get` endpoint will return the details of the actual booking.
        - It returns original number of devices that are requested as well as the remaining number of devices in the booking that can be assigned
        `remainingDevices` >= 0 and <= `bookingDeviceCount`
        - Once a device is successfully assigned to the booking, `remainingDevices` will be reduced by 1, and once the device is released then it will be incremented by 1
        - Booking Information is also returned as part of the message body when the devices are successfully assigned to the booking.
        - `bookingId` is present when `bookingStatus` is `REQUESTED`, `SCHEDULED`, or `ACTIVATED` — the booking resource exists and is addressable. It is absent when `bookingStatus` is `TERMINATED` at creation time, meaning the operator rejected the booking synchronously and no resource was created.

      allOf:
        - type: object
          properties:
            bookingId:
              $ref: "#/components/schemas/BookingId"
            bookingDeviceCount:
              $ref: "#/components/schemas/DeviceCount"
            remainingDevices:
              $ref: "#/components/schemas/RemainingDeviceCount"
            qosProfile:
              $ref: "#/components/schemas/QosProfileName"
            startTime:
              $ref: "#/components/schemas/Time"
            duration:
              $ref: "#/components/schemas/Duration"
            serviceArea:
              $ref: "../common/CAMARA_common.yaml#/components/schemas/Area"
            bookingStatus:
              $ref: "#/components/schemas/BookingStatus"
            statusInfo:
              $ref: "#/components/schemas/BookingStatusInfo"
          required:
            - remainingDevices
            - qosProfile
            - startTime
            - duration
            - serviceArea
            - bookingStatus

    DeviceAssignmentInput:
      description: |
        Array of devices that needs to be assigned to a booking.
        - The size of the array should be less than or equal to the devices that are remaining in the original booking.
        - At least one device identifier is required when a 2-legged access token is used.
        - In a 3-legged situation, only one device can be assigned at a time, and the device details are automatically generated from the access token
        - In such a situation, `Devices` array SHOULD NOT be provided.
      type: object
      additionalProperties: false
      properties:
        devices:
          $ref: "#/components/schemas/Devices"
        sink:
          type: string
          format: uri
          maxLength: 2048
          pattern: ^https:\/\/.+$
          description: The address to which events shall be delivered, using the HTTP protocol.
          example: "https://endpoint.example.com/sink"
        sinkCredential:
          $ref: "../common/CAMARA_event_common.yaml#/components/schemas/SinkCredential"

    DeviceAssignmentOutput:
      description: |
         This schema is used to return device information associated with the booking as an output.
         - It will have the `bookingDetails` along with all the originally requested information.
         - In some situations (ex: assignments using 3-legged access token) the device details should not be disclosed as per the privacy and other legal requirements.
         - For example:
           - If there are 10 devices assigned in a booking; but the GET operation returns only 7; It means 3 devices can't be disclosed
           - The source of truth is in the following properties in the booking details: `bookingDeviceCount` and `remainingDevices`.
           - In such a situation the operator SHOULD set  `statusInfo` as `DEVICE_DISCLOSURE_POLICY_APPLIED` to clearly communicate the fact that some devices are not disclosed.

      allOf:
        - type: object
          properties:
            bookingDetails:
              $ref: "#/components/schemas/BookingDetails"
            devices:
              $ref: "#/components/schemas/DeviceResponseArray"
            assignmentStatus:
              $ref: "#/components/schemas/AssignmentStatus"
            statusInfo:
              $ref: "#/components/schemas/AssignmentStatusInfo"
          required:
            - assignmentStatus

    RetrieveBookingByDevice:
      description: Attributes to look for QoS Booking
      type: object
      additionalProperties: false
      properties:
        device:
          $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"

    RetrieveBookingsOutput:
      description: QoS bookings for a given device
      type: array
      items:
        $ref: "#/components/schemas/BookingDetails"
      minItems: 0
      maxItems: 50

    QosProfileName:
      description: |
        A unique name for identifying a specific QoS profile.
        This may follow different formats depending on the service providers implementation.
        Some options addresses:
          - A UUID style string
          - Support for predefined profiles QOS_S, QOS_M, QOS_L, and QOS_E
          - A searchable descriptive name
        The set of QoS Profiles that an operator is offering can be retrieved by means of the [QoS Profile API](link TBC).
      type: string
      example: QCI_1_voice
      minLength: 3
      maxLength: 256
      pattern: "^[a-zA-Z0-9_.-]+$"

    QosBookingEventType:
      description: Event type values for QoS Booking and Assignment notifications
      type: string
      enum:
        - "org.camaraproject.qos-booking-and-assignment.v0.booking-status-changed"
        - "org.camaraproject.qos-booking-and-assignment.v0.assignment-status-changed"

    QosBookingNotificationEvent:
      description: |
        API-level notification event envelope for QoS Booking and Assignment.
        Extends the common CloudEvent base with API-specific event type constraint.
      allOf:
        - $ref: "../common/CAMARA_event_common.yaml#/components/schemas/CloudEvent"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/QosBookingEventType"
      discriminator:
        propertyName: "type"
        mapping:
          org.camaraproject.qos-booking-and-assignment.v0.booking-status-changed: "#/components/schemas/EventBookingStatusChanged"
          org.camaraproject.qos-booking-and-assignment.v0.assignment-status-changed: "#/components/schemas/EventAssignmentStatusChanged"

    EventBookingStatusChanged:
      description: Event to notify a QoS Booking lifecycle status change
      allOf:
        - $ref: "#/components/schemas/QosBookingNotificationEvent"
        - type: object
          properties:
            data:
              type: object
              description: Event details depending on the event type
              required:
                - bookingDetails
                - bookingStatus
              properties:
                bookingDetails:
                  $ref: "#/components/schemas/BookingOutput"
                bookingStatus:
                  $ref: "#/components/schemas/BookingStatusChanged"
                statusInfo:
                  $ref: "#/components/schemas/BookingStatusInfo"
          required:
            - data

    EventAssignmentStatusChanged:
      description: Event to notify a Device Assignment status change
      allOf:
        - $ref: "#/components/schemas/QosBookingNotificationEvent"
        - type: object
          properties:
            data:
              type: object
              description: Event details depending on the event type
              required:
                - assignmentStatus
                - deviceDetails
              properties:
                deviceDetails:
                  $ref: "#/components/schemas/DeviceAssignmentOutput"
                assignmentStatus:
                  $ref: "#/components/schemas/AssignmentStatusChanged"
                statusInfo:
                  $ref: "#/components/schemas/AssignmentStatusInfo"
          required:
            - data

    AssignmentStatus:
      description: |
        The outcome status of a device assignment or release operation. The status can be one of the following:
        * `REQUESTED` - The request has been accepted but is still being processed asynchronously. A callback (`EventAssignmentStatusChanged`) will deliver the final outcome.
        * `ASSIGNED` - All requested devices are now assigned to the booking.
        * `PARTIAL_SUCCESS` - The request completed with partial success; some but not all devices were assigned or released. `statusInfo` has additional information.
        * `RELEASED` - One or more devices have been successfully released from the booking. Used exclusively by the release operation.
        * `FAILURE` - The request failed. `statusInfo` may provide additional information about the reason.
      type: string
      enum:
        - REQUESTED
        - ASSIGNED
        - PARTIAL_SUCCESS
        - RELEASED
        - FAILURE

    AssignmentStatusChanged:
      description: |
        The resolved status delivered in an `EventAssignmentStatusChanged` callback after a prior `REQUESTED` outcome.
        * `ASSIGNED` - All requested devices are assigned to the booking.
        * `PARTIAL_SUCCESS` - The assignment completed with partial success.
        * `RELEASED` - The release operation completed; one or more devices were released from the booking.
        * `FAILURE` - The operation failed. In rare cases a previously successful assignment may also transition to `FAILURE` due to a catastrophic network event; `statusInfo` will provide additional context.
      type: string
      enum:
        - ASSIGNED
        - PARTIAL_SUCCESS
        - RELEASED
        - FAILURE

    BookingStatus:
      description: |
        The lifecycle state of a QoS Booking. The booking status can be one of the following:
        * `REQUESTED` - The booking request has been accepted but the operator has not yet confirmed availability. A `booking-status-changed` notification will deliver the final state.
        * `SCHEDULED` - The booking has been confirmed and is reserved for a future start time. Devices may be assigned now.
        * `ACTIVATED` - The booking window is open and QoS resources are live. Assigned devices may use them subject to eligibility.
        * `TERMINATED` - The booking has reached a terminal state. The `bookingId` is no longer valid. `statusInfo` provides the reason (`BOOKING_CANCELLED`, `BOOKING_EXPIRED`, `SERVICE_NOT_AVAILABLE`, `QOS_PROFILE_NOT_SUPPORTED`, `NETWORK_TERMINATED`, `DURATION_EXPIRED`, or `BOOKING_UNKNOWN_ERROR`).
      type: string
      enum:
        - REQUESTED
        - SCHEDULED
        - ACTIVATED
        - TERMINATED

    BookingStatusChanged:
      description: |
        Status values used in booking status-change notifications (EventBookingStatusChanged).
        Excludes REQUESTED because notification callbacks only fire when the operator has
        reached a confirmed or terminal state after a prior REQUESTED state.
      type: string
      enum:
        - SCHEDULED
        - ACTIVATED
        - TERMINATED

    BookingStatusInfo:
      description: |
        A free-form string providing additional context about the current booking `bookingStatus`.
        Values are not exhaustive; API providers MAY use additional implementation-specific values.

        Transition reasons for `bookingStatus: REQUESTED`:
        * `VALIDATION_PENDING` - The booking is pending operator validation. A `booking-status-changed` notification will follow.

        Transition reasons for `bookingStatus: SCHEDULED` or `ACTIVATED`:
        * `BOOKING_SCHEDULED` - The booking was confirmed and scheduled for a future start time.
        * `BOOKING_ACTIVATED` - Booking schedule started and the booking is activated.
        * `DELETE_REQUESTED` - User requested deletion; async processing is in progress (`bookingStatus` transitions to `TERMINATED` on completion).

        Transition reasons for `bookingStatus: TERMINATED`:
        * `BOOKING_CANCELLED` - The booking was cancelled by the consumer or operator.
        * `BOOKING_EXPIRED` - The booking window ended normally.
        * `SERVICE_NOT_AVAILABLE` - The booking could not be fulfilled; the operator could not support the service area, device count, or QoS profile in the requested time.
        * `QOS_PROFILE_NOT_SUPPORTED` - The requested QoS profile is not supported by the operator.
        * `DURATION_EXPIRED` - The booking was terminated because the requested duration expired.
        * `NETWORK_TERMINATED` - The network terminated the QoS booking for an unknown reason.
        * `BOOKING_UNKNOWN_ERROR` - An unknown error occurred.
        * `BOOKING_ACCEPTED` - Deprecated. Use `BOOKING_SCHEDULED` instead.
      type: string
      maxLength: 256
      example: "BOOKING_SCHEDULED"

    AssignmentStatusInfo:
      description: |
        A free-form string providing additional context about the current assignment `assignmentStatus`.
        Values are not exhaustive; API providers MAY use additional implementation-specific values.

        * `ASSIGNMENT_COMPLETED` - The assignment of devices completed successfully.
        * `DEVICE_RELEASED` - One or more devices were successfully released from the booking.
        * `RELEASE_PENDING` - Release of requested devices is currently in progress. Some might have already been released and some are still being processed.
        * `DEVICE_NOT_FOUND` - One or more devices could not be found or validated.
        * `DEVICE_UNKNOWN_ERROR` - One or more devices failed to be assigned or released due to an unknown error.
        * `DEVICE_DISCLOSURE_POLICY_APPLIED` - Some or all device identifiers are withheld due to privacy or legal requirements.
        * `QUOTA_EXCEEDED` - The number of devices requested exceeds the remaining capacity of the booking.
        * `VALIDATION_PENDING` - The assignment request is pending validation.
        * `BOOKING_INVALID` - The booking referenced in the request is invalid.
        * `BOOKING_CANCELLED` - The booking referenced has been cancelled.
        * `BOOKING_EXPIRED` - The booking referenced has expired and is no longer active.
        * `BOOKING_TERMINATED` - The booking was terminated by the operator.
      type: string
      maxLength: 256
      example: "ASSIGNMENT_COMPLETED"

    DeviceCount:
      description: |
        Number of devices that may be assigned to the booking.
      type: integer
      default: 1
      format: int32
      minimum: 1
      maximum: 50

    RemainingDeviceCount:
      description: |
        Number of devices that are remaining in the current booking.
      type: integer
      format: int32
      minimum: 0
      maximum: 50

    Time:
      description: |
        Date and time when the API consumer requests the QoS profile to become available.
        It must follow [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339#section-5.6) and must have time zone.
      type: string
      format: date-time
      maxLength: 64
      example: "2024-06-01T12:00:31Z"

    Duration:
      description: |
        Requested session duration in seconds.  Value may be explicitly limited for the QoS profile, as specified in the Qos Profile (see qos-profile API).
        Implementations can grant the requested session duration or set a different duration from `startTime`, based on network policies or conditions.
        The actual value may be limited by QoS Profile.
      type: integer
      format: int32
      minimum: 1
      maximum: 2147483647
      example: 3600

    Devices:
      description: |
        Array of devices to be assigned to the booking and provisioned.  At least one device is required.
        Not to be provided when a 3-legged access token already identifies a device.
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: "../common/CAMARA_common.yaml#/components/schemas/Device"

    DeviceResponseArray:
      description: List of device identifiers that have been successfully assigned based on the request.
      type: array
      minItems: 1
      maxItems: 50
      items:
        $ref: "../common/CAMARA_common.yaml#/components/schemas/DeviceResponse"

  responses:
    Generic400:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic400"
    Generic401:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic401"
    Generic403:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic403"
    Generic404:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic404"
    Generic410:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic410"
    Generic422:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic422"
    Generic429:
      $ref: "../common/CAMARA_common.yaml#/components/responses/Generic429"

    CreateBookingOrAssign400:
      description: Bad Request when creating a QoS booking or assigning devices to a booking.
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 400
                  code:
                    enum:
                      - INVALID_ARGUMENT
                      - OUT_OF_RANGE
                      - QOS_BOOKING_AND_ASSIGNMENT.DURATION_OUT_OF_RANGE
                      - INVALID_CREDENTIAL
                      - INVALID_TOKEN
                      - INVALID_SINK
          examples:
            GENERIC_400_INVALID_ARGUMENT:
              description: Invalid Argument. Generic Syntax Exception
              value:
                status: 400
                code: INVALID_ARGUMENT
                message: Client specified an invalid argument, request body or query param.
            GENERIC_400_OUT_OF_RANGE:
              description: Out of Range. Specific Syntax Exception used when a given field has a pre-defined range or a invalid filter criteria combination is requested
              value:
                status: 400
                code: OUT_OF_RANGE
                message: Client specified an invalid range.
            DurationOutOfRangeForQoSProfile:
              description: The requested duration is out of the allowed range for the specific QoS profile
              value:
                status: 400
                code: QOS_BOOKING_AND_ASSIGNMENT.DURATION_OUT_OF_RANGE
                message: The requested duration is out of the allowed range for the specific QoS profile
            GENERIC_400_INVALID_CREDENTIAL:
              value:
                status: 400
                code: INVALID_CREDENTIAL
                message: Only Access token is supported
            GENERIC_400_INVALID_TOKEN:
              value:
                status: 400
                code: INVALID_TOKEN
                message: Only bearer token is supported
            GENERIC_400_INVALID_SINK:
              description: Invalid sink value
              value:
                status: 400
                code: INVALID_SINK
                message: sink not valid for the specified protocol

    Generic409:
      description: Handle all conflict error conditions as per commonalities guidelines
      headers:
        x-correlator:
          $ref: "#/components/headers/x-correlator"
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../common/CAMARA_common.yaml#/components/schemas/ErrorInfo"
              - type: object
                properties:
                  status:
                    enum:
                      - 409
                  code:
                    enum:
                      - ABORTED
                      - ALREADY_EXISTS
                      - CONFLICT
                      - INCOMPATIBLE_STATE
          examples:
            GENERIC_409_ABORTED:
              description: Concurreny of processes of the same nature/scope
              value:
                status: 409
                code: ABORTED
                message: Concurrency conflict.
            GENERIC_409_ALREADY_EXISTS:
              description: Trying to create an existing resource
              value:
                status: 409
                code: ALREADY_EXISTS
                message: The resource that a client tried to create already exists.
            GENERIC_409_CONFLICT:
              description: Duplication of an existing resource
              value:
                status: 409
                code: CONFLICT
                message: A specified resource duplicate entry found.
            GENERIC_409_INCOMPATIBLE_STATE:
              description: A resource referenced in the request is in an incompatible state for the requested operation
              value:
                status: 409
                code: INCOMPATIBLE_STATE
                message: A referenced resource is in an incompatible state.

  examples:
    BOOKING_INPUT_1:
      summary: Booking Request Example-1
      description: This is an example of a booking request.
      value:
        bookingDeviceCount: 15
        qosProfile: "QOS_MEDIA_BROADCAST"
        startTime: "2025-10-27T15:00:00.000Z"
        duration: 3600
        serviceArea:
          areaType: "CIRCLE"
          center:
            latitude: 37.735851
            longitude: -127.10066
          radius: 100
        sink: "https://application-server.com/notifications"
        sinkCredential:
          credentialType: ACCESSTOKEN
          accessToken: "<access_token>"
          accessTokenExpiresUtc: "2025-12-31T23:59:59Z"
          accessTokenType: bearer

    BOOKING_INPUT_2:
      summary: Booking Request Example-2
      description: This is an example of a booking request.
      value:
        bookingDeviceCount: 27
        qosProfile: "QOS_MEDIA_BROADCAST"
        startTime: "2025-10-27T15:00:00.000Z"
        duration: 3600
        serviceArea:
          areaType: "POLYGON"
          boundary:
            - latitude: 37.789172
              longitude: -122.406558
            - latitude: 37.789172
              longitude: -122.396558
            - latitude: 37.779172
              longitude: -122.396558
            - latitude: 37.779172
              longitude: -122.406558
        sink: "https://application-server.com/notifications"
        sinkCredential:
          credentialType: ACCESSTOKEN
          accessToken: "<access_token>"
          accessTokenExpiresUtc: "2025-12-31T23:59:59Z"
          accessTokenType: bearer


    BOOKING_SUCCESSFUL:
      summary: Booking Confirmed (Scheduled)
      description: QoS Booking is confirmed and a valid `bookingId` is returned. The booking start time is in the future so `bookingStatus` is `SCHEDULED`.
      value:
        bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
        bookingDeviceCount: 15
        remainingDevices: 15
        qosProfile: "QOS_MEDIA_BROADCAST"
        startTime: "2025-10-27T15:00:00.000Z"
        duration: 3600
        serviceArea:
          areaType: "CIRCLE"
          center:
            latitude: 37.735851
            longitude: -127.10066
          radius: 100
        bookingStatus: "SCHEDULED"
        statusInfo: "BOOKING_SCHEDULED"

    BOOKING_FAILURE:
      summary: Booking Terminated (Declined)
      description: The operator determined synchronously that the booking cannot be fulfilled (`bookingStatus` = `TERMINATED`). No `bookingId` is returned. `statusInfo` provides the decline reason.
      value:
        bookingDeviceCount: 5
        remainingDevices: 5
        qosProfile: "QOS_MEDIA_BROADCAST"
        startTime: "2025-10-27T15:00:00.000Z"
        duration: 3600
        serviceArea:
          areaType: "CIRCLE"
          center:
            latitude: 37.735851
            longitude: -127.10066
          radius: 100
        bookingStatus: "TERMINATED"
        statusInfo: "SERVICE_NOT_AVAILABLE"

    BOOKING_PENDING:
      summary: Booking Requested (Pending Confirmation)
      description: QoS Booking resource is created and a `bookingId` is returned, but operator confirmation is still in progress (`bookingStatus` = `REQUESTED`). A `booking-status-changed` notification will deliver the final outcome (`SCHEDULED`, `ACTIVATED`, or `TERMINATED`).
      value:
        bookingId: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        bookingDeviceCount: 5
        remainingDevices: 5
        qosProfile: "QOS_MEDIA_BROADCAST"
        startTime: "2025-10-27T15:00:00.000Z"
        duration: 3600
        serviceArea:
          areaType: "CIRCLE"
          center:
            latitude: 37.735851
            longitude: -127.10066
          radius: 100
        bookingStatus: "REQUESTED"
        statusInfo: "VALIDATION_PENDING"

    BOOKING_RETRIEVED:
      summary: Retrieve Booking
      description: Retrieve booking information from its `bookingId`. `bookingStatus` and `statusInfo` reflect the current booking lifecycle state.
      value:
        bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
        bookingDeviceCount: 15
        remainingDevices: 15
        qosProfile: "QOS_MEDIA_BROADCAST"
        startTime: "2025-10-27T15:00:00.000Z"
        duration: 3600
        serviceArea:
          areaType: "CIRCLE"
          center:
            latitude: 37.735851
            longitude: -127.10066
          radius: 100
        bookingStatus: "ACTIVATED"
        statusInfo: "BOOKING_ACTIVATED"

    BOOKING_CANCELLED:
      summary: Booking Cancelled (notification payload)
      description: Example `booking-status-changed` CloudEvent payload when a booking is successfully cancelled.
      value:
        bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
        bookingDeviceCount: 15
        remainingDevices: 15
        qosProfile: "QOS_MEDIA_BROADCAST"
        startTime: "2025-10-27T15:00:00.000Z"
        duration: 3600
        serviceArea:
          areaType: "CIRCLE"
          center:
            latitude: 37.735851
            longitude: -127.10066
          radius: 100
        bookingStatus: "TERMINATED"
        statusInfo: "BOOKING_CANCELLED"

    CANCELLATION_PENDING:
      summary: Cancellation is Requested
      description: Delete a booking using a  valid `bookingId`.  Delete operation is pending as operator may need more time to process the request.
      value:
        bookingId: "8e2f6f30-0a1c-4c6b-92e1-1bd05aef1c58"
        bookingDeviceCount: 15
        remainingDevices: 7
        qosProfile: "QOS_MEDIA_BROADCAST"
        startTime: "2025-10-27T15:00:00.000Z"
        duration: 3600
        serviceArea:
          areaType: "CIRCLE"
          center:
            latitude: 37.735851
            longitude: -127.10066
          radius: 100
        bookingStatus: "REQUESTED"
        statusInfo: "DELETE_REQUESTED"

    ASSIGNMENT_INPUT_1:
      summary: Assignment Input - All Identifiers
      description: Assignment Input example. To demonstrate, four devices are used, each with a different type of device identifiers.
      value:
        devices:
          - phoneNumber: "+14145550101"
          - networkAccessIdentifier: "+123456789@domain.com"
          - ipv4Address:
              publicAddress: "203.0.113.0"
              publicPort: 59765
          - ipv6Address: "2001:db8:85a3:8d3:1319:8a2e:370:7344"
        sink: "https://application-server.com/notifications"
        sinkCredential:
          credentialType: ACCESSTOKEN
